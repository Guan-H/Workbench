name: private-space-office
services:
  office:
    image: ${ONLYOFFICE_IMAGE:?Run scripts/start-office.ps1 to resolve a fixed digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Generate the local secret with start-office.ps1}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../frontend/office-host:/var/www/onlyoffice/documentserver/web-apps/office-host:ro
      - office_data:/var/www/onlyoffice/Data
      - office_cache:/var/lib/onlyoffice
    mem_limit: 4g
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1/healthcheck | grep -q true"]
      interval: 15s
      start_period: 90s
      retries: 24
      timeout: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
volumes:
  office_data:
  office_cache:
