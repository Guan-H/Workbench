spring:
  application:
    name: private-space-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/private_space?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:private_space}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: ${PRIVATE_SPACE_IMPORT_REQUEST_SIZE:1030MB}

server:
  tomcat:
    max-part-count: 4100
    max-parameter-count: 10000
    max-swallow-size: ${PRIVATE_SPACE_IMPORT_REQUEST_SIZE:1030MB}
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /api/system
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,privateStorage,diskSpace
  health:
    diskspace:
      path: ${PRIVATE_SPACE_STORAGE_PATH:../data/objects}

private-space:
  retention:
    enabled: ${PRIVATE_SPACE_RETENTION_ENABLED:true}
    history-days: ${PRIVATE_SPACE_HISTORY_RETENTION_DAYS:30}
    recycle-days: ${PRIVATE_SPACE_RECYCLE_RETENTION_DAYS:30}
    orphan-days: ${PRIVATE_SPACE_ORPHAN_RETENTION_DAYS:30}
    export-lease: ${PRIVATE_SPACE_EXPORT_LEASE:PT2H}
  import:
    max-files: ${PRIVATE_SPACE_IMPORT_MAX_FILES:2000}
    max-bytes: ${PRIVATE_SPACE_IMPORT_MAX_BYTES:1073741824}
  setup-token: ${PRIVATE_SPACE_SETUP_TOKEN:}
  secure-cookie: ${PRIVATE_SPACE_SECURE_COOKIE:false}
  allowed-origins: ${PRIVATE_SPACE_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  storage:
    path: ${PRIVATE_SPACE_STORAGE_PATH:../data/objects}
